<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Experimental Camera</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/addons/p5.sound.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.js"></script>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    #sketch-container {
      position: relative;
      width: 640px;
      margin: 40px auto;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="sketch-container"></div>

  <script>
    let faceMesh;
    let video;
    let faces = [];

    let filter1;
    let slider;

    let meshButton;
    let filterButton;
    let saveButton;

    let mode = "mesh";
    let canvas;

    function preload() {
      faceMesh = ml5.faceMesh({
        maxFaces: 1,
        flipped: true
      });
    }

    function gotFaces(results) {
      faces = results;
    }

    function setup() {
      canvas = createCanvas(640, 480);
      canvas.parent("sketch-container");

      video = createCapture(VIDEO, { flipped: true });
      video.size(width, height);
      video.hide();

      faceMesh.detectStart(video, gotFaces);

      filter1 = createGraphics(width, height);
      filter1.pixelDensity(1);

      slider = createSlider(0, 255, 127);
      slider.parent("sketch-container");
      slider.position(270, 440);
      slider.style("width", "100px");

      meshButton = createButton("faceMesh");
      meshButton.parent("sketch-container");
      meshButton.position(30, 20);
      meshButton.mousePressed(() => {
        mode = "mesh";
        slider.hide();
      });

      filterButton = createButton("rainbow filter");
      filterButton.parent("sketch-container");
      filterButton.position(130, 20);
      filterButton.mousePressed(() => {
        mode = "filter";
        slider.show();
      });

      saveButton = createButton("Save Pic");
      saveButton.parent("sketch-container");
      saveButton.position(30, 440);
      saveButton.mousePressed(savePic);

      slider.hide();
    }

    function draw() {
      background(220);
      image(video, 0, 0, width, height);

      if (mode === "mesh") {
        drawFaceMeshMode();
      } else if (mode === "filter") {
        drawFilterMode();
      }
    }

    function drawFaceMeshMode() {
      if (faces.length > 0) {
        let face = faces[0];

        noStroke();

        // face oval
        beginShape();
        fill(241, 194, 125, 180);
        for (let p of face.faceOval.keypoints) {
          vertex(p.x, p.y);
        }
        endShape(CLOSE);

        // left eye
        beginShape();
        fill(173, 216, 230);
        for (let p of face.leftEye.keypoints) {
          vertex(p.x, p.y);
        }
        endShape(CLOSE);

        // left eyebrow
        beginShape();
        fill(255, 200, 255);
        for (let p of face.leftEyebrow.keypoints) {
          vertex(p.x, p.y);
        }
        endShape(CLOSE);

        // right eye
        beginShape();
        fill("#90EE90");
        for (let p of face.rightEye.keypoints) {
          vertex(p.x, p.y);
        }
        endShape(CLOSE);

        // right eyebrow
        beginShape();
        fill("#00008B");
        for (let p of face.rightEyebrow.keypoints) {
          vertex(p.x, p.y);
        }
        endShape(CLOSE);

        // lips
        beginShape();
        fill(255, 0, 0);
        for (let p of face.lips.keypoints) {
          vertex(p.x, p.y);
        }
        endShape(CLOSE);
      }
    }

    function drawFilterMode() {
      let val = slider.value();

      filter1.loadPixels();
      for (let j = 0; j < height; j++) {
        for (let i = 0; i < width; i++) {
          let index = (i + j * width) * 4;

          filter1.pixels[index] = val;
          filter1.pixels[index + 1] = i;
          filter1.pixels[index + 2] = j;
          filter1.pixels[index + 3] = 100;
        }
      }
      filter1.updatePixels();

      image(filter1, 0, 0, width, height);
    }

    function savePic() {
      saveCanvas(canvas, "photo", "jpg");
    }
  </script>
</body>
</html>
